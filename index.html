<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="./style.css">
  </link>
</head>

<body>



  <section class="weatherapp">

    <div class="header">
      <div class="header__nav">
        <div class="header__nav buttons">
          <button class="buttons about">About</button>
          <button class="buttons api">WeatherApi</button>
          <div class="buttons dropdown">
            <button class="themes">Themes</button>
            <div class="dropdown-items">
              <p class="themes auto">Auto</p>
              <p class="themes day">Sunny</p>
              <p class="themes night">Cloudy</p>
            </div>
          </div>
        </div>
      </div>

      <div class="header__logo">
        <img class="logo" src="./"></img>
      </div>

      <div class="weather">
        <div class="weather__data">
          <div class="city"></div>
          <div class="degrees"></div>
        </div>
      </div>

      <div class="input__data">
        <input class="input" type="text" placeholder="...type your city" /></input>
        <button class="input button">&#x2946;</button>
      </div>

      <div class="date-time">
        <div class="time"></div>
        <div class="date"></div>
      </div>

  </section>

  <script src="./script.js"></script>
</body>


</html>
